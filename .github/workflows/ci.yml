name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 0

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
      - run: npm run build
      # Includes vectors shared with Rust (testdata/sdk-vectors.json).
      - run: npm test

  demo:
    name: end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/hoosat-verify/go.mod
          cache-dependency-path: tools/hoosat-verify/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      # 5 local nodes, DKG, byzantine node, policy refusals, mock-API send, SDK -> coordinator,
      # then re-verification with rusty-kaspa and HTND's own Go engine.
      - run: ./demo.sh

  cluster:
    name: Docker cluster (production mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: htn-tsn
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 5 nodes with encrypted shares, signed registry, pinned mutual TLS; DKG, signing on both
      # chains, and refusals for strangers and a forged registry.
      - run: deploy/cluster/cluster.sh init
      - run: deploy/cluster/cluster.sh up
      - run: deploy/cluster/cluster.sh selftest
      - if: always()
        run: deploy/cluster/cluster.sh logs --no-color | tail -100 || true
