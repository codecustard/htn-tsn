[workspace]
resolver = "2"
members = ["crates/tsn-core", "crates/tsn-node", "crates/tsn-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tsn-core = { path = "crates/tsn-core" }
frost-secp256k1-tr = { version = "3", features = ["serde"] }
# `internals` exposes the share constructors needed for path-based key derivation.
frost-core = { version = "3", features = ["internals"] }
k256 = { version = "0.13", features = ["arithmetic", "schnorr"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
anyhow = "1"
kaspa-consensus-core = "2.1"
kaspa-txscript = "2.1"
kaspa-addresses = "2.1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
